      "担担面是川味小吃中的代表性食物，相传为1841年四川自贡一个叫陈包包的小贩创制，因为早期是用扁担挑在肩上沿街叫卖，所以叫作担担面，至今已经有上百年历史。",

const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sec=()=>DATA.find(s=>s.id===state.active), allQ=()=>DATA.flatMap(s=>s.questions), isChecked=q=>!!state.checked[q.n], isWrong=q=>isChecked(q)&&state.answers[q.n]&&state.answers[q.n]!==q.a;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('save-status').textContent='进度已自动保存到当前浏览器 · 在线与离线版分别保存'}catch(e){$('save-status').textContent='浏览器未允许本地保存；本次仍可练习，关闭页面后进度可能丢失'}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3600)}
function modal(title,body,action,ok='确定'){ $('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-ok').textContent=ok;dialogAction=action;$('dialog-cancel').hidden=!action;$('dialog').showModal() }
$('dialog-ok').onclick=()=>{$('dialog').close();if(dialogAction)dialogAction()};$('dialog-cancel').onclick=()=>$('dialog').close();
function renderNav(){ $('nav').innerHTML=DATA.map((s,i)=>{const done=s.questions.filter(q=>!!state.answers[q.n]).length;return `<button data-section="${s.id}" class="${s.id===state.active?'active':''}" ${s.id===state.active?'aria-current="page"':''}><span class="number">${String(i+1).padStart(2,'0')}</span><div><div class="name">${esc(s.title)}</div><div class="sub">${s.sorting?'排序 · 不计分':s.questions[0].n+'—'+s.questions.at(-1).n+'题 · '+done+'/'+s.questions.length}</div></div></button>`}).join('') }
function renderStats(){const qs=allQ(),done=qs.filter(q=>state.answers[q.n]).length,graded=qs.filter(q=>isChecked(q)&&state.answers[q.n]),correct=graded.filter(q=>state.answers[q.n]===q.a).length,wrong=graded.length-correct; const card=(name,v,suffix,bar='')=>`<div class="stat"><small>${name}</small><strong>${v}</strong><span>${suffix}</span>${bar}</div>`;$('stats').innerHTML=card('总答题进度',done,'/ 41',`<div class="track"><div class="fill" style="width:${done/41*100}%"></div></div>`)+card('已批改',graded.length,'题')+card('已批改正确率',graded.length?Math.round(correct/graded.length*100)+'%':'—','按已答题计算')+card('待复习错题',wrong,'题');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',state.mode===b.dataset.mode)) }
function renderReading(){let s=sec();$('section-title').textContent=s.title;$('section-meta').textContent=s.kicker;$('reading').innerHTML=`<div class="article-title">${esc(s.title)}</div><div class="article-sub">${esc(s.kicker)} · ${s.paras.length}个${s.sorting?'选项段':'自然段'}</div>${s.note?`<div class="notice">${esc(s.note)}</div>`:''}`+s.paras.map((p,i)=>{let text=esc(p),target=highlight&&highlight.p===i+1;if(target&&highlight.quote&&p.includes(highlight.quote))text=text.replace(esc(highlight.quote),`<mark>${esc(highlight.quote)}</mark>`);return `<p id="p-${i+1}" class="para ${target?'target':''}"><span class="pnum">${s.sorting?String.fromCharCode(65+i):String(i+1).padStart(2,'0')}</span>${text}</p>`}).join('');$('read-footer').textContent=s.sorting?'C段缺失 · 原有A—G选项已保留':'原文保留 · 解析按自然段定位';document.documentElement.style.setProperty('--font',state.font+'px') }
function renderQuestion(q){const val=state.answers[q.n],checked=isChecked(q),correct=val===q.a;return `<section class="question" id="q-${q.n}"><div class="qtop"><span class="qid">${q.n}</span><span class="qkind">${esc(q.kind)}</span>${checked?`<span class="badge ${!val?'empty':correct?'good':'bad'}">${!val?'未作答':correct?'✓ 正确':'× 错误'}</span>`:''}</div><h3 class="qt">${esc(q.t)}</h3><div class="options" role="radiogroup" aria-label="第${q.n}题">${q.opts.map((o,i)=>{const l=LETTERS[i],sel=val===l;let cls=checked?(l===q.a?'correct':sel?'wrong':''):sel?'selected':'';return `<label class="option ${cls} ${checked?'locked':''}"><input type="radio" name="q${q.n}" value="${l}" data-q="${q.n}" ${sel?'checked':''} ${checked?'disabled':''}><span class="letter">${l}</span><span class="ot">${esc(o)}</span>${checked&&l===q.a?'<span class="result">✓ 答案</span>':checked&&sel?'<span class="result">× 所选</span>':''}</label>`}).join('')}</div>${checked?`<div class="explanation"><strong>参考答案 ${q.a} · ${esc(q.opts[LETTERS.indexOf(q.a)])}</strong><p>${esc(q.why)}</p><div class="evidence"><small>原文依据 · 第${q.p}段</small>“${esc(q.quote)}”</div><button class="btn text" data-evidence="${q.n}">↗ 定位并高亮原文</button><details><summary>逐项辨析 · 为什么其他选项不合适？</summary><div class="feedback">${q.feedback.map((f,i)=>`<div><b>${LETTERS[i]}${LETTERS[i]===q.a?' ✓':''}</b>　${esc(f)}</div>`).join('')}</div></details>${q.note?`<div class="warning">${esc(q.note)}</div>`:''}</div><div class="question-actions"><button class="btn text" data-retry="${q.n}">重新作答此题</button></div>`:state.mode==='practice'?`<div class="question-actions"><button class="btn text" data-check="${q.n}" ${val?'':'disabled'}>检查此题 →</button></div>`:''}</section>` }
function renderQuestions(keepScroll=false){const before=$('questions').scrollTop,s=sec();$('filter').hidden=!!s.sorting;$('question-label').textContent=s.sorting?'段落排序 · 参考讨论':'选择与思考';if(s.sorting){renderSort();return}let qs=s.questions;if(filter==='wrong')qs=qs.filter(isWrong);if(filter==='unanswered')qs=qs.filter(q=>!state.answers[q.n]);const done=s.questions.filter(q=>state.answers[q.n]).length,graded=s.questions.filter(q=>isChecked(q)&&state.answers[q.n]),correct=graded.filter(q=>state.answers[q.n]===q.a).length;
$('questions').innerHTML=`${graded.length?`<div class="summary"><strong>本篇已批改 ${graded.length} 题 · 答对 ${correct} 题</strong><br>正确率 ${Math.round(correct/graded.length*100)}%（按已答且已批改题计算） · 未作答 ${s.questions.length-done} 题</div>`:''}<div class="jump-list" style="margin-top:16px" aria-label="题号导航">${s.questions.map(q=>`<button data-jump="${q.n}" class="${isWrong(q)?'fail':state.answers[q.n]?'done':''}">${q.n}</button>`).join('')}</div>`+(qs.length?qs.map(renderQuestion).join(''):`<div class="empty-state">${filter==='wrong'?'当前篇目没有已批改错题。':'当前筛选下没有题目。'}<br><button class="btn text" id="show-all">显示全部题目</button></div>`);
$('question-footer').innerHTML=`<span>已作答 <b>${done}</b> / ${s.questions.length}</span><div class="actions"><button class="btn" id="reset-section">重练本篇</button><button class="btn primary" id="submit-section">提交本篇并批改</button></div>`;if(keepScroll)$('questions').scrollTop=before }
function renderSort(){const opts=['A','B','D','E','F','G'],positions=[1,2,4,5,6];let used=Object.values(state.sort).filter(Boolean);$('questions').innerHTML=`<div class="sortbox"><div class="notice">C固定在第3位。请从A、B、D、E、F、G中选5段填入其余位置，并排除1段。由于C正文缺失，本组不计分。</div>${[1,2,3,4,5,6].map(i=>i===3?'<div class="sortrow"><b>位置 3</b><span class="tag">C · 固定位置，正文缺失</span></div>':`<div class="sortrow"><label for="sort${i}">位置 ${i}</label><select id="sort${i}" data-sort="${i}"><option value="">请选择段落</option>${opts.map(o=>`<option value="${o}" ${state.sort[i]===o?'selected':''} ${used.includes(o)&&state.sort[i]!==o?'disabled':''}>${o} 段</option>`).join('')}</select></div>`).join('')}<div class="sortrow"><span>排除的干扰段</span><strong>${used.length===5?opts.find(o=>!used.includes(o)):'完成5个位置后显示'}</strong></div>${state.sortSeen?`<div class="explanation"><strong>参考推断，不能认定为唯一标准答案</strong><div class="ref">B → F → C → A → G → D</div><p>可能的干扰项：E。你的安排：${[1,2,3,4,5,6].map(i=>i===3?'C':state.sort[i]||'＿').join(' → ')}。</p><div class="evidence"><small>线索1 · B与F</small>“曾经”写早期奢华；“此后”转入普及、削减预算。<button class="btn text" data-sort-evidence="2">定位B段</button><button class="btn text" data-sort-evidence="6">定位F段</button></div><div class="evidence"><small>线索2 · A与G</small>A的“该计划”需要前文介绍计划；G重复“厨师的秘密会议”，并交代2013年后的变化。<button class="btn text" data-sort-evidence="1">定位A段</button><button class="btn text" data-sort-evidence="7">定位G段</button></div><p>D以“今天”谈部分航空仍保留的高端餐饮服务，可以作为当代补充；E转向机舱气压、湿度和嗅觉，与飞机餐服务的历史变迁相比，主题衔接较弱。</p><div class="warning">关键限制：无法核对C是否引出“该计划”，也无法排除C与E的潜在衔接。上面的完整顺序属于基于现有段落的暂定推断；补齐C后才可可靠定序。你的排列不判正误。</div></div>`:''}</div>`;$('question-footer').innerHTML=`<span>已填 ${used.length} / 5 · 不计分</span><button class="btn primary" id="analyze-sort">查看参考分析</button>` }
function render(){renderNav();renderStats();renderReading();renderQuestions();updateMobile()}
function updateMobile(){ $('read-panel').classList.toggle('hide-mobile',mobile!=='read');$('questions-panel').classList.toggle('hide-mobile',mobile!=='questions');document.querySelectorAll('[data-mobile]').forEach(b=>b.classList.toggle('on',b.dataset.mobile===mobile)) }
function submit(){const s=sec(),missing=s.questions.filter(q=>!state.answers[q.n]);const action=()=>{s.questions.forEach(q=>state.checked[q.n]=true);persist();renderStats();renderQuestions();$('questions').scrollTop=0;toast('已批改本篇，未作答题不计入正确率。')};if(missing.length)modal('本篇还有未作答题',`<p>还有 ${missing.length} 题未选。继续批改会显示本篇全部参考答案；未作答题单独标注，正确率只统计已答题。</p>`,action,'继续批改');else action() }
function resetSection(){modal('重新练习本篇',`<p>清除本篇的选择与批改状态，其余篇目的记录保留。</p>`,()=>{sec().questions.forEach(q=>{delete state.answers[q.n];delete state.checked[q.n]});filter='all';$('filter').value='all';highlight=null;persist();render();toast('本篇已重置，可以重新作答。')},'重新练习')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.section){state.active=d.section;highlight=null;filter='all';$('filter').value='all';persist();render();$('reading').scrollTop=0;$('questions').scrollTop=0}if(d.mode){state.mode=d.mode;persist();renderStats();renderQuestions(true);toast(d.mode==='practice'?'即时练习：选完后点击“检查此题”。':'独立作答：完成后统一提交批改。')}if(d.mobile){mobile=d.mobile;updateMobile()}if(d.check){state.checked[d.check]=true;persist();renderStats();renderQuestions(true)}if(d.retry){delete state.checked[d.retry];delete state.answers[d.retry];filter='all';$('filter').value='all';persist();renderNav();renderStats();renderQuestions(true);$('q-'+d.retry).scrollIntoView({behavior:'smooth',block:'start'})}if(d.evidence){const q=sec().questions.find(q=>q.n===+d.evidence);highlight={p:q.p,quote:q.quote};renderReading();mobile='read';updateMobile();$('p-'+q.p).scrollIntoView({behavior:'smooth',block:'center'})}if(d.sortEvidence){highlight={p:+d.sortEvidence};renderReading();mobile='read';updateMobile();$('p-'+d.sortEvidence).scrollIntoView({behavior:'smooth',block:'center'})}if(d.jump){filter='all';$('filter').value='all';renderQuestions(true);$('q-'+d.jump).scrollIntoView({behavior:'smooth',block:'start'})}if(b.id==='submit-section')submit();if(b.id==='reset-section')resetSection();if(b.id==='show-all'){filter='all';$('filter').value='all';renderQuestions()}if(b.id==='clear-highlight'){highlight=null;const top=$('reading').scrollTop;renderReading();$('reading').scrollTop=top}if(b.id==='smaller'||b.id==='larger'){state.font=Math.min(26,Math.max(15,state.font+(b.id==='larger'?1:-1)));document.documentElement.style.setProperty('--font',state.font+'px');persist()}if(b.id==='analyze-sort'){if(Object.values(state.sort).filter(Boolean).length<5){toast('请先填完5个可选位置，再查看参考分析。');return}state.sortSeen=true;persist();renderQuestions();toast('已显示参考推断；本组不判正误。')} });
document.addEventListener('change',e=>{if(e.target.dataset.q){const n=e.target.dataset.q;if(state.checked[n])return;state.answers[n]=e.target.value;persist();renderNav();renderStats();renderQuestions(true);document.querySelector('input[name="q'+n+'"]:checked')?.focus({preventScroll:true})}if(e.target.dataset.sort){state.sort[e.target.dataset.sort]=e.target.value;state.sortSeen=false;persist();renderQuestions(true)}if(e.target.id==='filter'){filter=e.target.value;renderQuestions()}});
$('help').onclick=()=>modal('如何使用阅见',`<p>① 左侧切换篇目；桌面端可同时看原文与题目。手机使用“阅读原文 / 答题与解析”切换。</p><p>② 独立作答：完成一篇后统一提交。即时练习：每题选择后点击“检查此题”。批改后选项锁定，可点“重新作答此题”。</p><p>③ 解析包含参考答案、推理、逐项辨析，以及可高亮的原文依据。“仅看错题”筛选当前篇目的已批改错题。</p><p>④ 共41道单选题；排序组不计分。第48题与C段缺失；第57题答案有一定歧义；74—87为改编题。科学材料按文意批改，不作为现实事实核验。</p><p>⑤ 下载版是完整单文件HTML，不需联网。进度保存在当前浏览器中，在线与离线不自动同步。禁用存储时仍可练习，但刷新后可能丢失进度。</p>`,null,'知道了');
$('download').onclick=()=>{const html='<!doctype html>\n'+document.documentElement.outerHTML;const doc=new DOMParser().parseFromString(html,'text/html');['nav','stats','questions','reading','section-title','section-meta','question-footer'].forEach(id=>{const el=doc.getElementById(id);if(el)el.innerHTML=''});doc.getElementById('dialog').removeAttribute('open');doc.getElementById('toast').style.display='none';const blob=new Blob(['<!doctype html>\n'+doc.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hsk_reading_studio_cn.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('离线版已下载，使用浏览器打开HTML即可练习。')};
render();
</script></body></html>
